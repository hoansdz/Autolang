name: CI

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            cmake_args: "-A x64 -DCMAKE_BUILD_TYPE=Release"
          - os: macos-latest
            generator: "Unix Makefiles"
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.cmake_args }}

      - name: Build project
        run: cmake --build build --config Release

      - name: Run tests
        run: cmake --build build --config Release --target run
