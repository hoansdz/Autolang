[build-system]
requires = ["setuptools", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.backends.legacy:build"

[tool.cibuildwheel]
# Chỉ build cho CPython 3.8 - 3.13, bỏ qua PyPy
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"

# Bỏ qua musl-linux (Alpine) và 32-bit
skip = "*-musllinux* *-win32 *-manylinux_i686"

# Cài pybind11 trước khi build
before-build = "pip install pybind11"

[tool.cibuildwheel.windows]
# Trên Windows GitHub Actions dùng MSVC (mặc định)
archs = ["AMD64"]

[tool.cibuildwheel.linux]
# Build trong container manylinux2014 để tương thích rộng
manylinux-x86_64-image = "manylinux2014"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
# Build cho cả Intel (x86_64) và Apple Silicon (arm64)
archs = ["x86_64", "arm64"]
